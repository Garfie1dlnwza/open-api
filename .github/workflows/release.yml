name: Release

# Conventional commits merged to main -> release-please opens (and keeps updating) a release PR.
# Merging that PR tags the version, publishes a GitHub Release and updates CHANGELOG.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
