name: Health check

# Probes every API in the catalog and publishes data/status.json to the status-data branch.
# Keeping results off main means status churn never lands in the release history.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No credentials stay on disk: npm install scripts and the probe run without a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Restore previous results (for history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true # the branch does not exist before the first run
        with:
          ref: status-data
          path: .status-prev
          persist-credentials: false
      - name: Seed history
        run: |
          if [ -f .status-prev/status.json ]; then
            mkdir -p data
            cp .status-prev/status.json data/status.json
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run health
      - name: Publish to status-data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp data/status.json "$work/status.json"
          cd "$work"
          git init -q -b status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "chore(health): update status.json"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push -f "https://github.com/${REPO}.git" status-data
      - name: Redeploy the site so it shows the new status
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
