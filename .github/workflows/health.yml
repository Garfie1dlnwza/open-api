name: Health check

# Probes every API in the catalog and publishes data/status.json to the status-data branch.
# Keeping results off main means status churn never lands in the release history.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore previous results (for history)
        run: |
          if git ls-remote --exit-code --heads origin status-data >/dev/null 2>&1; then
            git fetch --depth=1 origin status-data
            mkdir -p data
            git show FETCH_HEAD:status.json > data/status.json
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run health
      - name: Publish to status-data
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp data/status.json "$work/status.json"
          cd "$work"
          git init -q -b status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "chore(health): update status.json"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-data
      - name: Redeploy the site so it shows the new status
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
