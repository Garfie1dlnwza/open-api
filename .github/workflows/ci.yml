name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD" | node scripts/check-commits.mjs
      - name: Typecheck, lint, hardcode and duplication checks, tests
        run: npm run check
      - name: Build the site
        run: npm run build

  audit:
    name: Dependency audit (when dependencies change)
    # Blocks a pull request that adds or bumps a vulnerable dependency, but stays out of the way of
    # PRs that do not touch the manifests. audit.yml re-checks everything weekly for new advisories.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did this PR change dependencies?
        id: deps
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Every manifest npm reads: the root and each workspace package.json (the * crosses
          # directories in a plain pathspec), the lockfile and .npmrc.
          if git diff --quiet "origin/${BASE}...HEAD" -- '*package.json' package-lock.json .npmrc; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.deps.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.deps.outputs.changed == 'true'
        run: npm ci
      - if: steps.deps.outputs.changed == 'true'
        run: npm audit --audit-level=high

