name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD" | node scripts/check-commits.mjs
      - name: Typecheck, lint, hardcode and duplication checks, tests
        run: npm run check
      - name: Build the site
        run: npm run build
