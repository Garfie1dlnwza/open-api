name: Deploy

# Needs repository variables DEPLOY_ENABLED=true, PUBLIC_SITE_URL, PUBLIC_PLAYGROUND_URL,
# CF_PAGES_PROJECT and secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Store the secrets on the `production` environment and restrict it to the main branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Secrets are only reachable from main. The real control is the production environment's
    # deployment branch rule (docs/release.md); this condition is a second layer.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false
      - name: Fetch latest health data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        continue-on-error: true # the branch does not exist before the first health run
        with:
          ref: status-data
          path: .status-prev
          persist-credentials: false
      - name: Seed health data
        run: |
          if [ -f .status-prev/status.json ]; then
            mkdir -p data
            cp .status-prev/status.json data/status.json
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Variables go through env, never straight into a shell line, and the site URL is reduced to
      # a bare origin (no trailing slash or path) so the Worker's allowlist matches the browser's Origin.
      - name: Normalise the site origin
        id: origin
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: echo "value=$(node -p 'new URL(process.env.SITE_URL).origin')" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ steps.origin.outputs.value }}
          PUBLIC_PLAYGROUND_URL: ${{ vars.PUBLIC_PLAYGROUND_URL }}
      - name: Deploy the playground Worker
        run: npx wrangler deploy --var "ALLOWED_ORIGINS:${ALLOWED_ORIGIN}"
        working-directory: apps/worker
        env:
          ALLOWED_ORIGIN: ${{ steps.origin.outputs.value }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the site
        run: npx wrangler pages deploy apps/web/dist --project-name "${PAGES_PROJECT}" --branch main
        env:
          PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
